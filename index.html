<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Harta Karun Jawi — 20 Level</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;font-family:system-ui,Arial;color:white;touch-action:none}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;gap:6px;pointer-events:none;font-size:clamp(12px,2.3vw,19px);font-weight:900;text-shadow:1px 2px 3px #000;background:#10243a9a;border-radius:12px;padding:8px}#controls{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}#controls .group{display:flex;gap:8px}button{touch-action:none;user-select:none;cursor:pointer}#controls button{pointer-events:auto;width:clamp(52px,11vw,76px);height:clamp(52px,11vw,76px);border:2px solid #e1ecff;border-radius:19px;background:#173c69d9;color:white;font-size:clamp(20px,4vw,29px);font-weight:900;box-shadow:0 4px 0 #081c37}#controls #attack{background:#aa3b37db}#controls #jump{background:#23826edb}#overlay{position:fixed;inset:0;background:#071324e8;display:flex;align-items:center;justify-content:center;padding:15px;overflow:auto}#panel{width:min(94vw,570px);max-height:95dvh;overflow:auto;text-align:center;background:linear-gradient(#273f62,#172b45);border:3px solid #ffcd6b;border-radius:19px;padding:18px;box-shadow:0 18px 60px #0009}h1{font-size:clamp(23px,4vw,35px);color:#ffe28c;margin:5px 0 12px}h2{font-size:23px;color:#ffe28c}p{line-height:1.5;margin:10px 0}#panel button{border:2px solid #bce8d2;border-radius:12px;padding:11px 16px;background:#168765;color:white;font-size:17px;font-weight:800;margin:5px}#panel .choice{background:#315582;min-width:42%;font-size:23px}#message{color:#ffdf7a;min-height:25px}#bar{height:9px;border-radius:12px;background:#344e65;overflow:hidden;margin:10px 0}#bar>div{height:100%;background:#f7cb60;width:5%}@media(max-height:450px){#panel{padding:9px}h1{font-size:23px}#controls button{width:53px;height:53px}#hud{padding:4px}}#rotateNotice{display:none;position:fixed;inset:0;z-index:9999;background:#091a32;color:white;align-items:center;justify-content:center;text-align:center;padding:24px}#rotateNotice .inner{max-width:380px}#rotateNotice strong{display:block;font-size:27px;color:#ffdb7a;margin:12px 0}#rotateNotice p{font-size:17px}#rotateNotice button{border:0;background:#168765;color:white;padding:13px 20px;border-radius:12px;font-size:17px;font-weight:800}@media(orientation:portrait) and (pointer:coarse){#rotateNotice{display:flex}}@media(orientation:landscape) and (max-height:500px){#hud{top:2px;font-size:13px;padding:3px 9px}#controls{bottom:5px;left:6px;right:6px}#controls button{width:49px;height:49px;font-size:20px;border-radius:12px}} </style></head><body><div id="rotateNotice"><div class="inner"><div style="font-size:65px">📱 ↻</div><strong>Pusing Telefon Melintang</strong><p>Game ini lebih sesuai dimainkan dalam mod landscape. Aktifkan Auto Rotate pada telefon jika perlu.</p><button id="tryLandscape">⛶ Cuba Skrin Penuh</button></div></div><canvas id="game"></canvas><div id="hud"><span id="lev">🗺️ Level 1/20</span><span id="hp">❤️❤️❤️</span><span id="coin">🪙 0/5</span><span id="points">⭐ 0</span></div><div id="controls"><div class="group"><button id="left" aria-label="Kiri">◀</button><button id="right" aria-label="Kanan">▶</button></div><div class="group"><button id="attack" aria-label="Serang">⚔️</button><button id="jump" aria-label="Lompat">⬆</button></div></div><div id="overlay"><div id="panel"></div></div><script>
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),panel=document.querySelector('#panel');
const W=960,H=540,GROUND=464,inputs={left:false,right:false,jump:false,attack:false};let sc=1,offX=0,offY=0,last=0,level=1,score=0,health=3,player,platforms=[],coins=[],enemies=[],bullets=[],door,paused=true,phase='menu',particles=[],cameraShake=0,hitCount=0;
const SAVE_KEY='harta_karun_jawi_20_level_v1';
 document.querySelector('#tryLandscape').addEventListener('click',async()=>{try{await document.documentElement.requestFullscreen?.();await screen.orientation?.lock?.('landscape')}catch(e){alert('Sila hidupkan Auto Rotate dan pusing telefon secara melintang.')} });
function readSave(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(s&&Number.isInteger(s.level)&&s.level>=1&&s.level<=20&&Number.isFinite(s.score)&&s.score>=0)return s}catch(e){}return null}
function writeSave(n=level){try{localStorage.setItem(SAVE_KEY,JSON.stringify({level:n,score,updated:new Date().toISOString()}))}catch(e){}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}
const WORDS=[['Burger','بورݢر','برݢر','بوڠر','بورکر'],['Sosej','سوسيج','سوسج','ساسيج','سوسيچ'],['Piza','ڤيزا','فيزا','ڤيزي','ڤيزو'],['Salad','سالاد','سلاد','ساليد','سالود'],['Spageti','سڤاݢيتي','سڤاݢتي','سڤاگيتي','سڤاݢيت'],['Stik','ستيک','ستک','ستيڬ','ستيق'],['Makaroni','ماکاروني','مکاروني','ماکارني','ماکارونيه'],['Sandwic','سيندويچ','سيندويج','سندويچ','سيندوچ'],['Pasta','ڤاستا','ڤستا','ڤاستي','فاستا'],['Lasagna','لاساݢنا','لاساݢني','لاسݢنا','لاسڬانا'],['Kompleks','کومڤليکس','کمڤليکس','کومڤليک','کومڤليس'],['Astronomi','استرونومي','استرونمي','استرونامي','استرونوم'],['Planetarium','ڤلانيتاريوم','ڤلانيتاريم','ڤلانتاريوم','ڤلانيتريوم'],['Auditorium','اءوديتوريوم','اوديتوريم','اءوديتوريم','اوديتوري'],['Komputer','کومڤيوتر','کومڤوتر','کمڤيوتر','کومڤيتور'],['Dokumentari','دوکومنتاري','دوکومنتري','دوکومينتاري','دوکمنتاري'],['Teleskop','تيليسکوڤ','تليسکوڤ','تيليسکوپ','تيليسکوف'],['Binokular','بينوکولر','بينوکولار','بينکولر','بينوکيلر'],['Kompas','کومڤس','کومڤاس','کمڤس','کومڤيس'],['Meteor','ميتيور','ميتور','ميتيو','ميتير']];
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;sc=Math.min(canvas.width/W,canvas.height/H);offX=(canvas.width-W*sc)/2;offY=(canvas.height-H*sc)/2}addEventListener('resize',resize);resize();
function rand(n){let x=Math.sin(n*78.233+level*12.41)*43758.5453;return x-Math.floor(x)}
function updateHUD(){document.querySelector('#lev').textContent=`🗺️ Level ${level}/20`;document.querySelector('#hp').textContent='❤️'.repeat(Math.max(0,health))+'🖤'.repeat(Math.max(0,3-health));document.querySelector('#coin').textContent=`🪙 ${coins.filter(c=>c.got).length}/${coins.length}`;document.querySelector('#points').textContent=`⭐ ${score}`}
function resetLevel(n){level=n;writeSave(n);platforms=[{x:0,y:GROUND,w:960,h:76}];coins=[];enemies=[];bullets=[];particles=[];health=3;hitCount=0;const pattern=(n-1)%5;for(let i=0;i<4;i++){let x=170+i*180,y=GROUND-76-(i%2)*43-(pattern%2)*12;platforms.push({x,y,w:115,h:17});coins.push({x:x+57,y:y-24,got:false})}coins.push({x:865,y:GROUND-26,got:false});let count=Math.min(3+Math.floor((n-1)/3),8);for(let i=0;i<count;i++){let x=260+i*(570/Math.max(1,count-1));enemies.push({x,y:GROUND-29,w:28,h:29,hp:n>=11?2:1,maxhp:n>=11?2:1,dir:i%2?1:-1,speed:0.65+n*.035,from:Math.max(155,x-65),to:Math.min(880,x+65),boss:false,flash:0,fire:55+i*28})}if(n%5===0){enemies.push({x:745,y:GROUND-65,w:55,h:65,hp:3+Math.floor(n/5)*2,maxhp:3+Math.floor(n/5)*2,dir:-1,speed:1.1+n*.025,from:600,to:880,boss:true,flash:0,fire:35});}player={x:55,y:GROUND-38,w:26,h:38,vx:0,vy:0,ground:true,dir:1,inv:0,attackCooldown:0,attackTimer:0};door={x:914,y:GROUND-76,w:34,h:76};paused=false;phase='play';overlay.style.display='none';updateHUD()}
function hitbox(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function spark(x,y,color){for(let i=0;i<8;i++)particles.push({x,y,vx:(rand(i+performance.now())-.5)*7,vy:-rand(i+14+performance.now())*5,life:25,color})}
function hurt(){if(player.inv>0)return;health--;player.inv=75;player.vy=-7;player.vx=-player.dir*5;cameraShake=9;updateHUD();if(health<=0){paused=true;phase='dead';showPanel(`<h1>💔 Misi Gagal!</h1><p>Musuh berjaya menghalang pengembaraan anda di Level ${level}.</p><p>Markah: <b>${score}</b></p><button id="retry">🔄 Cuba Level Ini Lagi</button><button id="again">🏠 Mula Dari Level 1</button>`);document.querySelector('#retry').onclick=()=>resetLevel(level);document.querySelector('#again').onclick=()=>{score=0;resetLevel(1)}}}
function doAttack(){if(player.attackCooldown>0)return;player.attackCooldown=28;player.attackTimer=12;const sword={x:player.dir>0?player.x+player.w:player.x-49,y:player.y+2,w:49,h:36};for(const e of enemies){if(e.hp>0&&hitbox(sword,e)){e.hp--;e.flash=10;spark(e.x+e.w/2,e.y+e.h/2,'#ffe16d');score+=e.hp<=0?(e.boss?120:25):5;updateHUD()}}}
function launchBullet(e){
  if(e.hp<=0 || bullets.length>=32)return;
  const x=e.x+e.w/2, y=e.y+Math.min(e.h/2,26);
  const dx=player.x+player.w/2-x, dy=player.y+player.h/2-y;
  const distance=Math.hypot(dx,dy)||1;
  const speed=e.boss?4.0+level*.07:2.5+level*.055;
  bullets.push({x,y,vx:dx/distance*speed,vy:dy/distance*speed,r:e.boss?9:6,life:190,boss:e.boss});
  if(e.boss && level>=10){
    for(const angle of [-.23,.23]){
      const a=Math.atan2(dy,dx)+angle;
      bullets.push({x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,r:7,life:170,boss:true});
    }
  }
}
function step(dt){if(paused)return;dt=Math.min(dt,2);player.inv=Math.max(0,player.inv-dt);player.attackCooldown=Math.max(0,player.attackCooldown-dt);player.attackTimer=Math.max(0,player.attackTimer-dt);if(inputs.attack&&player.attackCooldown<=0)doAttack();let speed=3.35;player.vx=((inputs.right?1:0)-(inputs.left?1:0))*speed;if(player.vx)player.dir=Math.sign(player.vx);if(inputs.jump&&player.ground){player.vy=-11.7;player.ground=false}let oldY=player.y;player.x=Math.max(0,Math.min(W-player.w,player.x+player.vx*dt));player.vy=Math.min(13,player.vy+.55*dt);player.y+=player.vy*dt;player.ground=false;for(const b of platforms){if(hitbox(player,b)&&player.vy>=0&&oldY+player.h<=b.y+10){player.y=b.y-player.h;player.vy=0;player.ground=true}}if(player.y>H+20)hurt();for(const c of coins){if(!c.got&&Math.abs(c.x-(player.x+13))<27&&Math.abs(c.y-(player.y+19))<29){c.got=true;score+=10;spark(c.x,c.y,'#ffd65c');updateHUD()}}for(const e of enemies){if(e.hp<=0)continue;
e.fire-=dt;
if(e.fire<=0){
  launchBullet(e);
  e.fire=(e.boss?70:140)-Math.min(38,level*2)+(e.boss?0:rand(e.x)*35);
}
e.flash=Math.max(0,e.flash-dt);e.x+=e.dir*e.speed*dt;if(e.x<e.from){e.x=e.from;e.dir=1}if(e.x>e.to){e.x=e.to;e.dir=-1}if(hitbox(player,e)){if(player.vy>2&&oldY+player.h<=e.y+13){e.hp--;e.flash=12;player.vy=-8;score+=e.hp<=0?(e.boss?120:25):5;spark(e.x+e.w/2,e.y,'#fbdc6e');updateHUD()}else hurt()}}for(const b of bullets){
 b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
 if(b.x+b.r>player.x && b.x-b.r<player.x+player.w &&
    b.y+b.r>player.y && b.y-b.r<player.y+player.h){
    b.life=0;hurt();
 }
}
bullets=bullets.filter(b=>b.life>0&&b.x>-25&&b.x<W+25&&b.y>-25&&b.y<H+25);
for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.16*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);cameraShake=Math.max(0,cameraShake-dt);if(enemies.every(e=>e.hp<=0))bullets=[];if(coins.every(c=>c.got)&&enemies.every(e=>e.hp<=0)&&hitbox(player,door)){paused=true;phase='quiz';showQuiz()}}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function draw(){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#10283d';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.setTransform(sc,0,0,sc,offX+(cameraShake?Math.sin(performance.now())*cameraShake:0),offY);let hue=(level*17)%100;let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,`hsl(${205+hue/4} 62% 33%)`);sky.addColorStop(1,'#72b9c5');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#d9efff';for(let i=0;i<7;i++){let x=(i*157+level*37)%1000-20,y=80+(i%3)*48;ctx.globalAlpha=.35;ctx.beginPath();ctx.ellipse(x,y,65,16,0,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.fillStyle='#306b77';for(let i=0;i<8;i++){let x=i*155-35;ctx.beginPath();ctx.moveTo(x,GROUND);ctx.lineTo(x+85,230+(i%3)*40);ctx.lineTo(x+195,GROUND);ctx.fill()}for(const b of platforms){rect(b.x,b.y,b.w,b.h,'#26354b');rect(b.x,b.y,b.w,7,'#91bca3');for(let x=b.x+3;x<b.x+b.w;x+=34){rect(x,b.y+10,30,20,'#7b8a9e');rect(x+3,b.y+13,11,4,'#a7b5c7');rect(x+18,b.y+23,8,4,'#4f627d')}}for(const c of coins)if(!c.got){ctx.fillStyle='#a66a1c';ctx.beginPath();ctx.arc(c.x,c.y,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffe17a';ctx.beginPath();ctx.arc(c.x,c.y,10,0,Math.PI*2);ctx.fill();rect(c.x-2,c.y-7,4,14,'#bb8126')}for(const e of enemies){if(e.hp<=0)continue;ctx.fillStyle=e.flash?'#fff':e.boss?'#782d65':'#9d433b';ctx.fillRect(e.x,e.y,e.w,e.h);rect(e.x+4,e.y+5,e.w-8,8,e.boss?'#f5bf63':'#ff9d78');rect(e.x+6,e.y+16,5,5,'#fff');rect(e.x+e.w-11,e.y+16,5,5,'#fff');rect(e.x+2,e.y+e.h-7,e.w-4,7,'#273045');if(e.boss){rect(e.x+5,e.y-11,e.w-10,8,'#2d283b');rect(e.x+5,e.y-11,(e.w-10)*e.hp/e.maxhp,8,'#e84d4d');ctx.fillStyle='#ffe49b';ctx.font='bold 13px system-ui';ctx.fillText('BOSS',e.x+5,e.y-16)}}if(door){rect(door.x,door.y,door.w,door.h,'#352c3e');rect(door.x+4,door.y+4,door.w-8,door.h-8,coins.every(c=>c.got)&&enemies.every(e=>e.hp<=0)?'#35a17b':'#9d4e42');rect(door.x+22,door.y+35,6,6,'#ffe080');}for(const b of bullets){
ctx.fillStyle=b.boss?'#ff653a':'#ed4dd3';
ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='#fff0b0';ctx.lineWidth=2;ctx.stroke();
}
if(player){let p=player;if(p.inv<=0||Math.floor(p.inv/5)%2===0){rect(p.x+3,p.y,20,8,'#b8c6db');rect(p.x,p.y+8,26,17,'#c5d3e6');rect(p.x+3,p.y+12,20,9,'#34465b');rect(p.x+(p.dir>0?17:5),p.y+14,4,4,'#fff');rect(p.x+4,p.y+25,18,8,'#d2a054');rect(p.x+2,p.y+33,9,5,'#1a2537');rect(p.x+15,p.y+33,9,5,'#1a2537');if(p.attackTimer>0){rect(p.dir>0?p.x+24:p.x-44,p.y+11,44,7,'#e7eef6');rect(p.dir>0?p.x+52:p.x-49,p.y+6,6,18,'#f5d26b')}}}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/25);rect(p.x,p.y,5,5,p.color)}ctx.globalAlpha=1;ctx.fillStyle='#0d273bb8';ctx.fillRect(8,47,410,29);ctx.fillStyle='#fff5c4';ctx.font='bold 14px system-ui';ctx.fillText('Elak peluru raksasa! Kutip syiling + kalahkan musuh 🚪',17,66);ctx.setTransform(1,0,0,1,0,0)}
function showPanel(html){overlay.style.display='flex';panel.innerHTML=html}function showQuiz(){let [word,correct,...wrong]=WORDS[level-1];let options=[correct,...wrong].map((s,i)=>({s,sort:(i*7+level*3)%4})).sort((a,b)=>a.sort-b.sort);showPanel(`<h1>🔐 PINTU JAWI — LEVEL ${level}</h1><p>Pilih ejaan Jawi yang betul bagi perkataan <b style="color:#ffe08b;font-size:23px">${word}</b>.</p><div id="options"></div><div id="message"></div>`);const choices=document.querySelector('#options');for(const item of options){const b=document.createElement('button');b.className='choice';b.textContent=item.s;b.onclick=()=>{if(item.s===correct){score+=70;updateHUD();if(level===20){clearSave();phase='win';showPanel(`<h1>🏆 HARTA KARUN DITEMUI!</h1><p>Syabas! Anda menewaskan semua musuh dan menamatkan <b>20 LEVEL</b>!</p><h2>⭐ ${score} mata</h2><button id="again">🎮 Main Semula</button>`);document.querySelector('#again').onclick=()=>{score=0;resetLevel(1)}}else{writeSave(level+1);phase='next';showPanel(`<h1>🗝️ Level ${level} Selesai!</h1><p>Jawapan betul! +70 mata. ${level%5===0?'👑 Anda telah menewaskan BOSS!':''}</p><div id="bar"><div style="width:${level*5}%"></div></div><p>${level}/20 level selesai</p><button id="next">➡️ Teruskan ke Level ${level+1}</button>`);document.querySelector('#next').onclick=()=>resetLevel(level+1)}}else{document.querySelector('#message').textContent='❌ Belum tepat! Cuba jawapan lain.'}};choices.appendChild(b)}}
function begin(){score=0;clearSave();resetLevel(1)}function resume(){const saved=readSave();if(saved){score=saved.score;resetLevel(saved.level)}else begin()}function menu(){paused=true;phase='menu';const saved=readSave();showPanel(`<h1>🏰 HARTA KARUN JAWI</h1><h2>⚔️ 20 LEVEL ADVENTURE</h2><p>Permainan Jawi Tahun 4: Kata Pinjaman Bahasa Inggeris (Makanan & Sains).</p><p>🪙 Kutip 5 syiling setiap level.<br>👾 Kalahkan raksasa dengan <b>⚔️ pedang</b> atau melompat ke atasnya.<br>💥 Raksasa menembak peluru! Lompat dan elak serangan.<br>👑 BOSS lebih kuat pada Level 5, 10, 15 dan 20.<br>🚪 Pergi ke pintu dan jawab soalan Jawi.</p><p>💻 A/D atau ←/→, Space untuk lompat, J untuk serang.<br>📱 Gunakan butang di skrin.</p>${saved?`<p style="color:#ffe28c">💾 Permainan disimpan: <b>Level ${saved.level}/20</b> · ⭐ ${saved.score} mata</p><button id="continue">▶️ SAMBUNG LEVEL ${saved.level}</button><br>`:''}<button id="start">${saved?'🔄 MAIN DARI LEVEL 1':'🎮 MULA MAIN'}</button><p style="font-size:12px;opacity:.85">💾 Auto Save: kemajuan disimpan pada browser/peranti ini sahaja. Jangan padam data browser atau gunakan mod Incognito.</p>`);document.querySelector('#start').onclick=()=>{if(saved&&!confirm('Mula semula dari Level 1? Kemajuan lama akan dipadam.'))return;begin()};if(saved)document.querySelector('#continue').onclick=resume}
const mapping={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump',KeyJ:'attack',KeyK:'attack'};addEventListener('keydown',e=>{if(mapping[e.code]){inputs[mapping[e.code]]=true;e.preventDefault()}});addEventListener('keyup',e=>{if(mapping[e.code])inputs[mapping[e.code]]=false});addEventListener('blur',()=>Object.keys(inputs).forEach(k=>inputs[k]=false));for(const k of Object.keys(inputs)){const b=document.getElementById(k);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);inputs[k]=true});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>inputs[k]=false)}function frame(t){let dt=last?(t-last)/16.666:1;last=t;step(dt);draw();requestAnimationFrame(frame)}menu();requestAnimationFrame(frame);
</script></body></html>
